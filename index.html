<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTB Daily Productivity</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: #f4f6f9; color: #1f2937; padding-bottom: 20px; }
  
  /* Header & Tabs */
  .header { background: #2563eb; color: #fff; padding: 16px; text-align: center; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(37,99,235,0.2); }
  .header h1 { font-size: 20px; margin-bottom: 4px; }
  .header p { font-size: 12px; opacity: 0.9; }
  
  .tabs { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 16px; }
  .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #e5e7eb; color: #4b5563; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .tab-btn.active { background: #2563eb; color: #fff; box-shadow: 0 2px 4px rgba(37,99,235,0.3); }
  
  .tab-content { display: none; padding: 0 16px; }
  .tab-content.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* Cards & Forms */
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; color: #374151; }
  input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 12px; background: #fff; }
  button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; }
  .btn-wa { background: #25D366; color: #fff; width: 100%; margin-bottom: 8px; font-size: 15px;}
  .btn-ghost { background: #f3f4f6; color: #374151; }
  .btn-today { background: #e0e7ff; color: #3730a3; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  .hidden { display: none !important; }

  /* Summary Stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat { background: #fff; padding: 12px; border-radius: 10px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.05); border: 1px solid #f3f4f6; }
  .stat .num { font-size: 20px; font-weight: 700; color: #2563eb; }
  .stat .lbl { font-size: 11px; color: #6b7280; text-transform: uppercase; margin-top: 4px; font-weight: 600; }
  .stat.full { grid-column: span 2; background: #fffbeb; border-color: #fde68a; }
  .stat.full .num { color: #d97706; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f9fafb; font-size: 11px; text-transform: uppercase; color: #6b7280; }
  .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-block; }
  .ok { background: #dcfce7; color: #166534; }
  .star { background: #fef3c7; color: #92400e; }
  .no { background: #fee2e2; color: #991b1b; }
  .absent { background: #e5e7eb; color: #4b5563; }
  .empty { text-align: center; color: #9ca3af; padding: 20px; font-size: 13px; }

  /* Staff Chips */
  .staff-chip-wrap { position: relative; display: inline-block; margin: 4px 4px 0 0; }
  .staff-chip { display: inline-flex; align-items: center; gap: 4px; background: #f3f4f6; padding: 6px 12px; border-radius: 20px; font-size: 13px; border: 1px solid #e5e7eb; }
  .dots-btn { background: transparent; color: #6b7280; padding: 0 4px; font-size: 16px; line-height: 1; border: none; cursor: pointer; }
  .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; min-width: 100px; margin-top: 4px; overflow: hidden; }
  .dropdown-menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; color: #991b1b; font-size: 13px; cursor: pointer; font-weight: 500; border-radius: 0; }
  .dropdown-menu button:hover { background: #fee2e2; }

  /* Rank Badge */
  .rank-1 { color: #d97706; font-weight: bold; font-size: 16px; }
  .rank-2 { color: #6b7280; font-weight: bold; font-size: 15px; }
  .rank-3 { color: #b45309; font-weight: bold; font-size: 15px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>NTB Daily Productivity</h1>
  <p>Minimum 1 NTB per day</p>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 Dashboard</button>
  <button class="tab-btn" onclick="switchTab('entry', this)">➕ Add Entry</button>
  <button class="tab-btn" onclick="switchTab('staff', this)">👥 Staff</button>
</div>

<!-- 1. DASHBOARD TAB -->
<div id="tab-dashboard" class="tab-content active">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size:15px; color:#1f2937;" id="dashTitle">Today's Productivity</h3>
      <button class="btn-today" onclick="setToday()">Aaj ki Date</button>
    </div>
    
    <!-- View Mode & Date -->
    <div class="row" style="margin-bottom:12px;">
      <div style="flex:1;">
        <label>Report Type</label>
        <select id="viewMode" onchange="toggleView()">
          <option value="daily">Daily (Rozana)</option>
          <option value="weekly">Weekly (Haftawar)</option>
          <option value="monthly">Monthly (Mahwar)</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>Select Date</label>
        <input type="date" id="filterDate" onchange="render()">
      </div>
    </div>
    
    <div class="stats" id="stats"></div>

    <button class="btn-wa" onclick="shareWhatsApp()">📲 Share on WhatsApp</button>
    <button class="btn-ghost" style="width:100%;" onclick="exportCSV()">Download CSV (Daily)</button>
  </div>

  <div class="card">
    <h3 style="font-size:14px;margin-bottom:12px;color:#374151;" id="tableTitle">Present Staff Report</h3>
    <div id="report"></div>
    <div id="absentBox" style="margin-top:16px;"></div>
  </div>
</div>

<!-- 2. ADD ENTRY TAB -->
<div id="tab-entry" class="tab-content">
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:12px;">📝 Daily Entry</h3>
    <label>Staff</label>
    <select id="staff"></select>
    
    <label>Date</label>
    <input type="date" id="date">
    
    <label>Status</label>
    <select id="status" onchange="toggleCount()">
      <option value="present">Present</option>
      <option value="absent">Absent</option>
    </select>
    
    <div id="countWrap">
      <label>NTB Count</label>
      <input type="number" id="count" min="0" value="1">
    </div>
    
    <label>Remarks (optional)</label>
    <input type="text" id="remarks" placeholder="e.g. 2 accounts / sick leave">
    
    <button class="btn-primary" onclick="addEntry()">Save Entry</button>
  </div>
</div>

<!-- 3. STAFF TAB -->
<div id="tab-staff" class="tab-content">
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:12px;">👥 Manage Staff</h3>
    <label>Staff Name</label>
    <input type="text" id="newStaff" placeholder="e.g. Ali Khan" onkeydown="if(event.key==='Enter')addStaff()">
    <button class="btn-primary" onclick="addStaff()">+ Add Staff</button>
    <div id="staffList" style="margin-top:16px;"></div>
  </div>
</div>

<script>
const STAFF_KEY = "ntb_staff";
const ENTRY_KEY = "ntb_entries";

/* ---------- TAB SWITCHING ---------- */
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tabId}`).classList.add('active');
  btn.classList.add('active');
}

/* ---------- STAFF ---------- */
function getStaff() { return JSON.parse(localStorage.getItem(STAFF_KEY) || "[]"); }
function saveStaff(list) { localStorage.setItem(STAFF_KEY, JSON.stringify(list)); }
function addStaff() {
  const input = document.getElementById("newStaff");
  const name = input.value.trim();
  if (!name) return alert("Naam likhein");
  const list = getStaff();
  if (list.some(s => s.toLowerCase() === name.toLowerCase())) return alert("Ye naam pehle se mojood hai");
  list.push(name);
  saveStaff(list);
  input.value = "";
  renderStaff();
  renderStaffDropdown();
}
function deleteStaff(name) {
  if (!confirm(`"${name}" ko delete karein? Purani entries safe rahengi.`)) return;
  const list = getStaff().filter(s => s !== name);
  saveStaff(list);
  renderStaff();
  renderStaffDropdown();
}

function renderStaff() {
  const list = getStaff();
  const box = document.getElementById("staffList");
  if (list.length === 0) {
    box.innerHTML = `<p style="color:#9ca3af;font-size:13px;">Abhi koi staff add nahi hua.</p>`;
    return;
  }
  box.innerHTML = list.map((n, index) => {
    const safeName = n.replace(/'/g, "\\'");
    return `
    <div class="staff-chip-wrap">
      <div class="staff-chip">
        ${n}
        <button class="dots-btn" onclick="toggleMenu(event, ${index})">⋮</button>
      </div>
      <div class="dropdown-menu" id="menu-${index}">
        <button onclick="deleteStaff('${safeName}')">Delete</button>
      </div>
    </div>`;
  }).join("");
}

function toggleMenu(e, index) {
  e.stopPropagation();
  document.querySelectorAll('.dropdown-menu').forEach(el => el.style.display = 'none');
  const menu = document.getElementById(`menu-${index}`);
  if (menu) menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
document.addEventListener('click', function() {
  document.querySelectorAll('.dropdown-menu').forEach(el => el.style.display = 'none');
});

function renderStaffDropdown() {
  const sel = document.getElementById("staff");
  const current = sel.value;
  const list = getStaff();
  if (list.length === 0) {
    sel.innerHTML = `<option value="">— Pehle staff add karein —</option>`;
  } else {
    sel.innerHTML = list.map(s => `<option>${s}</option>`).join("");
    if (list.includes(current)) sel.value = current;
  }
}

/* ---------- ENTRIES ---------- */
function getEntries() { return JSON.parse(localStorage.getItem(ENTRY_KEY) || "[]"); }
function saveEntries(list) { localStorage.setItem(ENTRY_KEY, JSON.stringify(list)); }
function toggleCount() {
  const s = document.getElementById("status").value;
  document.getElementById("countWrap").classList.toggle("hidden", s === "absent");
}

function addEntry() {
  const staff = document.getElementById("staff").value;
  const date = document.getElementById("date").value;
  const status = document.getElementById("status").value;
  const count = status === "absent" ? 0 : parseInt(document.getElementById("count").value || "0");
  const remarks = document.getElementById("remarks").value.trim();

  if (!staff) return alert("Pehle staff add karein");
  if (!date) return alert("Date select karein");

  const list = getEntries();
  const existing = list.find(e => e.staff === staff && e.date === date);
  if (existing) {
    existing.status = status;
    existing.count = count;
    existing.remarks = remarks;
  } else {
    list.push({ id: Date.now() + Math.random(), staff, date, status, count, remarks });
  }
  saveEntries(list);
  
  document.getElementById("remarks").value = "";
  document.getElementById("count").value = 1;
  
  document.getElementById("filterDate").value = date;
  render();
  switchTab('dashboard', document.querySelectorAll('.tab-btn')[0]);
  alert("Entry Saved Successfully!");
}

function statusBadge(e) {
  if (e.status === "absent") return `<span class="badge absent">Absent</span>`;
  if (e.count >= 2) return `<span class="badge star">⭐ ${e.count} — Top</span>`;
  if (e.count === 1) return `<span class="badge ok">✅ 1 — Target Met</span>`;
  return `<span class="badge no">❌ 0 — Zero Prod</span>`;
}

function setToday() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById("filterDate").value = today;
  render();
}

function toggleView() {
  render();
}

/* ---------- DATE RANGE HELPERS ---------- */
function getWeekRange(dateStr) {
  let d = new Date(dateStr);
  let day = d.getDay() || 7; // Monday = 1, Sunday = 7
  d.setDate(d.getDate() - day + 1); // Monday
  let start = d.toISOString().slice(0,10);
  d.setDate(d.getDate() + 6); // Sunday
  let end = d.toISOString().slice(0,10);
  return { start, end };
}

function getMonthRange(dateStr) {
  let d = new Date(dateStr);
  let year = d.getFullYear();
  let month = d.getMonth();
  let start = new Date(year, month, 1).toISOString().slice(0,10);
  let end = new Date(year, month + 1, 0).toISOString().slice(0,10);
  return { start, end };
}

/* ---------- RENDER DASHBOARD ---------- */
function render() {
  const viewMode = document.getElementById("viewMode").value;
  const filterDate = document.getElementById("filterDate").value;
  const allEntries = getEntries();

  const d = new Date(filterDate);
  const dayStr = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  const titleEl = document.getElementById("dashTitle");

  if (viewMode === "daily") {
    // ---- DAILY LOGIC ----
    const list = allEntries.filter(e => e.date === filterDate);
    titleEl.innerHTML = `Daily Productivity <span style="font-size:12px;color:#6b7280;font-weight:normal;">(${dayStr})</span>`;
    document.getElementById("tableTitle").innerText = "Daily Present Staff Report";

    const present = list.filter(e => e.status === "present");
    const absent  = list.filter(e => e.status === "absent");
    const totalNTB = present.reduce((s,e)=> s + e.count, 0);
    const topPerformers = present.filter(e => e.count >= 2).length; 
    const targetMet = present.filter(e => e.count === 1).length; 
    const zeroProd = present.filter(e => e.count === 0).length; 
    
    const topStaff = present.length ? present.reduce((a,b)=> b.count > a.count ? b : a) : null;
    const topStaffName = (topStaff && topStaff.count > 0) ? topStaff.staff : "—";

    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="num">${totalNTB}</div><div class="lbl">Total NTB</div></div>
      <div class="stat"><div class="num">${topPerformers}</div><div class="lbl">Top Performers</div></div>
      <div class="stat"><div class="num">${targetMet}</div><div class="lbl">Target Met (1)</div></div>
      <div class="stat"><div class="num">${zeroProd}</div><div class="lbl">Zero Productivity</div></div>
      <div class="stat"><div class="num">${absent.length}</div><div class="lbl">Absent</div></div>
      <div class="stat full"><div class="num">${topStaffName}</div><div class="lbl">🏆 Top Performer of the Day</div></div>
    `;

    if (present.length === 0) {
      document.getElementById("report").innerHTML = `<div class="empty">Is date ke liye koi entry nahi hai.</div>`;
    } else {
      const sorted = [...present].sort((a,b)=> b.count - a.count);
      let html = `<table><thead><tr><th>Staff</th><th>NTB</th><th>Status</th></tr></thead><tbody>`;
      sorted.forEach(e => {
        html += `<tr>
          <td><strong>${e.staff}</strong><br><span style="font-size:11px;color:#9ca3af">${e.remarks || ""}</span></td>
          <td>${e.count}</td>
          <td>${statusBadge(e)}<br><button class="btn-ghost" style="margin-top:4px;padding:2px 6px;font-size:10px;width:auto;" onclick="delEntry('${e.id}')">Del</button></td>
        </tr>`;
      });
      html += "</tbody></table>";
      document.getElementById("report").innerHTML = html;
    }

    if (absent.length === 0) {
      document.getElementById("absentBox").innerHTML = "";
    } else {
      let html = `<h4 style="font-size:12px;color:#6b7280;margin-bottom:8px;text-transform:uppercase;">Absent (${absent.length})</h4><div style="display:flex;flex-wrap:wrap;gap:8px;">`;
      absent.forEach(e => {
        html += `<span class="badge absent" style="padding:6px 12px;">${e.staff} <span onclick="delEntry('${e.id}')" style="cursor:pointer;margin-left:4px;color:#991b1b;">✕</span></span>`;
      });
      html += `</div>`;
      document.getElementById("absentBox").innerHTML = html;
    }

  } else {
    // ---- WEEKLY / MONTHLY LOGIC ----
    let range = (viewMode === "weekly") ? getWeekRange(filterDate) : getMonthRange(filterDate);
    let list = allEntries.filter(e => e.date >= range.start && e.date <= range.end);
    
    let modeText = (viewMode === "weekly") ? "Weekly" : "Monthly";
    titleEl.innerHTML = `${modeText} Productivity <span style="font-size:12px;color:#6b7280;font-weight:normal;">(${range.start} to ${range.end})</span>`;
    document.getElementById("tableTitle").innerText = `${modeText} Leaderboard (Top NTBs)`;

    // Aggregate by staff
    let staffData = {};
    list.forEach(e => {
      if (e.status === "present") {
        if (!staffData[e.staff]) staffData[e.staff] = { ntb: 0 };
        staffData[e.staff].ntb += e.count;
      }
    });

    // Convert to array and sort
    let leaderboard = Object.keys(staffData).map(name => ({
      staff: name,
      ntb: staffData[name].ntb
    })).sort((a,b) => b.ntb - a.ntb);

    let totalNTB = leaderboard.reduce((s, e) => s + e.ntb, 0);
    let topPerformers = leaderboard.filter(e => e.ntb >= 10).length; // Assuming 10+ is a milestone for month/week
    let topStaffName = leaderboard.length > 0 ? leaderboard[0].staff : "—";

    document.getElementById("stats").innerHTML = `
      <div class="stat full"><div class="num">${totalNTB}</div><div class="lbl">Total NTB in this ${modeText}</div></div>
      <div class="stat full"><div class="num">${topStaffName}</div><div class="lbl">🏆 Top Performer of the ${modeText}</div></div>
    `;

    if (leaderboard.length === 0) {
      document.getElementById("report").innerHTML = `<div class="empty">Is duration mein koi entry nahi hai.</div>`;
    } else {
      let html = `<table><thead><tr><th>Rank</th><th>Staff</th><th>Total NTB</th></tr></thead><tbody>`;
      leaderboard.forEach((e, index) => {
        let rankClass = index === 0 ? "rank-1" : index === 1 ? "rank-2" : index === 2 ? "rank-3" : "";
        let rankText = index === 0 ? "🥇 1st" : index === 1 ? "🥈 2nd" : index === 2 ? "🥉 3rd" : `${index + 1}th`;
        
        html += `<tr>
          <td class="${rankClass}">${rankText}</td>
          <td><strong>${e.staff}</strong></td>
          <td><span class="badge star" style="font-size:13px;">⭐ ${e.ntb}</span></td>
        </tr>`;
      });
      html += "</tbody></table>";
      document.getElementById("report").innerHTML = html;
    }
    document.getElementById("absentBox").innerHTML = ""; // Hide absent in weekly/monthly
  }
}

function delEntry(id) {
  if (!confirm("Delete this entry?")) return;
  const list = getEntries().filter(e => String(e.id) !== String(id));
  saveEntries(list);
  render();
}

/* ---------- WHATSAPP ---------- */
function shareWhatsApp() {
  const viewMode = document.getElementById("viewMode").value;
  const filterDate = document.getElementById("filterDate").value;
  const allEntries = getEntries();

  if (viewMode === "daily") {
    const list = allEntries.filter(e => e.date === filterDate);
    if (list.length === 0) return alert("Pehle is date ke liye entries karein.");

    const present = list.filter(e => e.status === "present").sort((a,b)=> b.count - a.count);
    const absent  = list.filter(e => e.status === "absent");
    const topStaff = present.filter(e => e.count >= 2); 
    const targetMetStaff = present.filter(e => e.count === 1); 
    const zeroProdStaff = present.filter(e => e.count === 0); 
    const totalNTB = present.reduce((s,e)=> s + e.count, 0);

    const d = new Date(filterDate);
    const dayStr = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });

    let msg = `*NTB Daily Report*\n📅 ${dayStr}\n\n`;
    msg += `📊 *Summary*\n• Total NTB: *${totalNTB}*\n• Top Performers: ${topStaff.length}\n• Target Met (1): ${targetMetStaff.length}\n• Zero Productivity: ${zeroProdStaff.length}\n• Absent: ${absent.length}\n\n`;

    if (topStaff.length > 0) {
      msg += `🏆 *Top Performing Staff*\n`;
      topStaff.forEach(e => { msg += `⭐ ${e.staff}: ${e.count}\n`; }); msg += `\n`;
    }
    if (targetMetStaff.length > 0) {
      msg += `✅ *Target Met (1)*\n`;
      targetMetStaff.forEach(e => { msg += `✅ ${e.staff}\n`; }); msg += `\n`;
    }
    if (zeroProdStaff.length > 0) {
      msg += `❌ *Zero Productivity*\n`;
      zeroProdStaff.forEach(e => { msg += `• ${e.staff}\n`; }); msg += `\n`;
    }
    if (absent.length > 0) {
      msg += `🚫 *Absent*\n`;
      absent.forEach(e => { msg += `• ${e.staff}\n`; });
    }
    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");

  } else {
    // Weekly / Monthly Share
    let range = (viewMode === "weekly") ? getWeekRange(filterDate) : getMonthRange(filterDate);
    let list = allEntries.filter(e => e.date >= range.start && e.date <= range.end);
    if (list.length === 0) return alert("Is duration mein koi entry nahi hai.");

    let staffData = {};
    list.forEach(e => {
      if (e.status === "present") {
        if (!staffData[e.staff]) staffData[e.staff] = { ntb: 0 };
        staffData[e.staff].ntb += e.count;
      }
    });

    let leaderboard = Object.keys(staffData).map(name => ({ staff: name, ntb: staffData[name].ntb })).sort((a,b) => b.ntb - a.ntb);
    let totalNTB = leaderboard.reduce((s, e) => s + e.ntb, 0);
    let modeText = (viewMode === "weekly") ? "Weekly" : "Monthly";

    let msg = `*NTB ${modeText} Report*\n📅 ${range.start} to ${range.end}\n\n`;
    msg += `📊 *Total NTB:* ${totalNTB}\n\n`;
    msg += `🏆 *Top Performers Leaderboard*\n`;

    leaderboard.forEach((e, index) => {
      let rank = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}.`;
      msg += `${rank} ${e.staff}: *${e.ntb} NTBs*\n`;
    });

    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
  }
}

/* ---------- EXPORT CSV ---------- */
function exportCSV() {
  const list = getEntries();
  if (list.length === 0) return alert("Koi data nahi hai");
  let csv = "Staff,Date,Status,NTB Count,Result,Remarks\n";
  list.forEach(e => {
    const result = e.status === "absent" ? "Absent" 
      : e.count >= 2 ? "Top Performer" 
      : e.count === 1 ? "Target Met" 
      : "Zero Productivity";
    csv += `"${e.staff}","${e.date}","${e.status}",${e.count},"${result}","${e.remarks || ""}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ntb_report_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
