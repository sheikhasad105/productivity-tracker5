
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E3A8A">
<title>Bank Productivity & CRM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  body{background:#EEF2F7;min-height:100vh;display:flex;justify-content:center;padding:14px;padding-bottom:40px; overflow-x:hidden;}
  .phone{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;}
  
  .header{background:#1E3A8A;color:#fff;border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(30,58,138,.2);}
  .header-text h1{font-size:15px;letter-spacing:1px;}
  .header-text p{font-size:11px;color:#BFDBFE;margin-top:4px;}

  .tabs{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.05); margin-bottom:5px;}
  .tab-btn{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:700;color:#64748B;border-radius:10px;cursor:pointer;border:none;background:none;transition:.2s;}
  .tab-btn.active{background:#1E3A8A;color:#fff;box-shadow:0 2px 5px rgba(30,58,138,.3);}

  .tab-content{display:none; flex-direction:column; gap:12px;}
  .tab-content.active{display:flex;}

  /* Summary Styles */
  .hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hero{background:#fff;border-radius:18px;padding:16px 10px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .hero .label{font-size:9px;color:#64748B;font-weight:800;letter-spacing:0.5px;}
  .hero .pct{font-size:28px;font-weight:800;margin:6px 0;}
  .bar{height:8px;background:#E2E8F0;border-radius:20px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:20px;transition:.4s;width:0%;}
  .bar-labels{display:flex;justify-content:space-between;font-size:9px;font-weight:700;margin-top:6px;}
  .green{color:#16A34A;} .red{color:#DC2626;}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .pill{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .pill .num{font-size:20px;font-weight:800;}
  .pill .lbl{font-size:9px;color:#64748B;font-weight:700;letter-spacing:.5px;margin-top:2px;}
  
  .form{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .form h3{font-size:12px;color:#1E3A8A;font-weight:800;letter-spacing:1px;margin-bottom:12px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{margin-bottom:10px;}
  .field label{font-size:10px;font-weight:700;color:#64748B;letter-spacing:.5px;}
  .field input, .field select{width:100%;margin-top:5px;padding:12px;font-size:15px;font-weight:700;border:2px solid #E2E8F0;border-radius:12px;outline:none;background:#F8FAFC;}
  .field input:focus, .field select:focus{border-color:#2563EB;background:#fff;}
  .btn{width:100%;padding:14px;background:#1E3A8A;color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;}
  .btn:active{transform:scale(.98);}
  
  .trend{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06); margin-bottom:20px;}
  .trend h3{font-size:12px;color:#1E3A8A;font-weight:800;margin-bottom:12px;}
  .chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:10px;}
  .chart .bar-w{flex:1;background:#E2E8F0;border-radius:6px 6px 0 0;position:relative;min-height:4px;}
  .chart .bar-w .fill{position:absolute;bottom:0;left:0;right:0;border-radius:6px 6px 0 0;}
  .chart .bar-w .d{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:8px;color:#94A3B8;}
  .chart-wrap{padding-bottom:18px;}

  /* Staff Manager Styles */
  .btn-green{background:#25D366; color:#fff;}
  .btn-blue{background:#2563EB; color:#fff;}
  .btn-orange{background:#F59E0B; color:#fff;}
  
  .staff-card{background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05); border-left:4px solid #1E3A8A;}
  .staff-info h4{font-size:15px;color:#0F172A; display:flex; align-items:center; gap:5px;}
  .staff-info p{font-size:10px; color:#64748B; margin-top:2px; font-style:italic;}
  .staff-stats{display:flex;gap:8px;margin-top:6px;}
  .stat-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;}
  .bg-green{background:#DCFCE7;color:#16A34A;}
  .bg-red{background:#FEE2E2;color:#DC2626;}
  .bg-blue{background:#DBEAFE;color:#2563EB;}
  
  .action-icon{background:none; border:none; font-size:18px; cursor:pointer; padding:5px; margin-left:2px;}
  .empty{text-align:center;color:#94A3B8;font-size:12px;padding:15px 0;}
  
  .settings-box{background:#FEF3C7; border:1px solid #FDE68A; border-radius:14px; padding:12px; display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;}
  .settings-box label{font-size:12px; font-weight:800; color:#92400E;}
  .settings-box input{width:60px; padding:6px; font-size:14px; font-weight:bold; border-radius:8px; border:1px solid #FDE68A; text-align:center;}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="header-text">
      <h1>BANK PRODUCTIVITY</h1>
      <p>Advanced CRM & Pending Tracker</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('summary')">📊 Summary</button>
    <button class="tab-btn" onclick="switchTab('staff')">👥 Staff Manager</button>
  </div>

  <!-- ================= SUMMARY TAB ================= -->
  <div id="tab-summary" class="tab-content active">
    <div class="hero-row">
      <div class="hero">
        <div class="label">TODAY'S ACCURACY</div>
        <div class="pct" id="todayPct">—</div>
        <div class="bar"><div class="bar-fill" id="todayFill"></div></div>
        <div class="bar-labels">
          <span class="green" id="todayCorrect">C: 0</span>
          <span class="red" id="todayDisc">D: 0</span>
        </div>
      </div>
      <div class="hero">
        <div class="label">THIS MONTH</div>
        <div class="pct" id="monthPct">—</div>
        <div class="bar"><div class="bar-fill" id="monthFill"></div></div>
        <div class="bar-labels">
          <span class="green" id="monthCorrect">C: 0</span>
          <span class="red" id="monthDisc">D: 0</span>
        </div>
      </div>
    </div>

    <div class="summary">
      <div class="pill"><div class="num" style="color:#2563EB" id="oTotal">0</div><div class="lbl">TOTAL OPENS</div></div>
      <div class="pill"><div class="num" style="color:#16A34A" id="oCorrect">0</div><div class="lbl">CORRECT</div></div>
      <div class="pill"><div class="num" style="color:#DC2626" id="oDisc">0</div><div class="lbl">DISCREPANCY</div></div>
      <div class="pill"><div class="num" style="color:#8B5CF6" id="oNtbs">0</div><div class="lbl">TOTAL NTB</div></div>
    </div>

    <div class="form">
      <h3>➕ ADD DAILY ENTRY (BANK LEVEL)</h3>
      <div class="field">
        <label>DATE</label>
        <input type="date" id="dateInput">
      </div>
      <div class="row">
        <div class="field">
          <label>TOTAL OPENS</label>
          <input type="number" id="totalInput" placeholder="0" inputmode="numeric">
        </div>
        <div class="field">
          <label>DISCREPANCY</label>
          <input type="number" id="discInput" placeholder="0" inputmode="numeric">
        </div>
      </div>
      <button class="btn" onclick="addEntry()">💾 SAVE ENTRY</button>
    </div>

    <div class="trend">
      <h3>📊 LAST 7 DAYS TREND</h3>
      <div class="chart-wrap"><div class="chart" id="chart"></div></div>
    </div>
  </div>

  <!-- ================= STAFF TAB ================= -->
  <div id="tab-staff" class="tab-content">
    
    <!-- SETTINGS & EXPORT -->
    <div class="settings-box">
      <label>🎯 Daily Target (Per Staff):</label>
      <input type="number" id="dailyTarget" value="1" min="1" onchange="saveTarget()">
    </div>

    <div class="row" style="margin-bottom:5px;">
      <button class="btn btn-blue" onclick="exportCSV()">📥 Export Excel</button>
      <button class="btn btn-green" onclick="shareList()">📤 Share Report</button>
    </div>

    <!-- ADD STAFF -->
    <div class="form">
      <h3>👤 ADD NEW STAFF</h3>
      <div class="field">
        <input type="text" id="newStaffName" placeholder="Staff Name (e.g. Ali)">
      </div>
      <div class="field">
        <input type="tel" id="newStaffPhone" placeholder="WhatsApp No (e.g. 923001234567)">
      </div>
      <button class="btn" style="padding:10px;" onclick="addStaffMaster()">➕ Add Staff</button>
    </div>

    <!-- STAFF DASHBOARD -->
    <div class="cust-section" style="background:transparent; box-shadow:none; padding:0;">
      <h3 style="color:#1E3A8A; font-size:13px; margin-bottom:8px;">📋 STAFF STATUS</h3>
      <div id="staffDashboard"></div>
    </div>

    <!-- LOG ACHIEVEMENT -->
    <div class="form" style="background:#F0FDF4; border:1px solid #BBF7D0;">
      <h3 style="color:#166534;">✅ LOG TODAY'S ACHIEVEMENT</h3>
      <div class="field">
        <label>SELECT DATE</label>
        <input type="date" id="logDate">
      </div>
      <div class="field">
        <label>SELECT STAFF</label>
        <select id="logStaffSelect">
          <option value="">-- Select Staff --</option>
        </select>
      </div>
      <div class="field">
        <label>ACCOUNTS OPENED TODAY</label>
        <input type="number" id="logOpened" placeholder="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>REMARKS (If Pending)</label>
        <input type="text" id="logRemark" placeholder="e.g. Customer kal aayega">
      </div>
      <button class="btn" style="background:#16A34A;" onclick="saveStaffLog()">✔ Save & Update</button>
    </div>

  </div>

</div>

<script>
  const $ = id => document.getElementById(id);
  
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    $(`tab-${tabId}`).classList.add('active');
    event.target.classList.add('active');
  }

  // ==================== SUMMARY LOGIC ====================
  let entries = JSON.parse(localStorage.getItem('accuracyEntries') || '[]');
  $('dateInput').valueAsDate = new Date();
  
  function colorFor(acc){ return acc >= 95 ? '#16A34A' : acc >= 80 ? '#F59E0B' : '#DC2626'; }

  function addEntry(){
    const date = $('dateInput').value;
    const total = +$('totalInput').value;
    const disc  = +$('discInput').value;
    
    if(!date){ alert('Please select a date'); return; }
    if(!total || total <= 0){ alert('Total must be greater than 0'); return; }
    
    entries = entries.filter(e => e.date !== date);
    entries.push({ date, total, disc });
    entries.sort((a,b) => b.date.localeCompare(a.date));
    localStorage.setItem('accuracyEntries', JSON.stringify(entries));
    
    $('totalInput').value = '';
    $('discInput').value = '';
    renderSummary();
  }

  function renderSummary(){
    if(entries.length){
      const e = entries[0];
      const corr = e.total - e.disc;
      const acc  = (corr / e.total) * 100;
      const col  = colorFor(acc);
      $('todayPct').textContent = acc.toFixed(1) + '%';
      $('todayPct').style.color = col;
      $('todayFill').style.width = acc + '%';
      $('todayFill').style.background = col;
      $('todayCorrect').textContent = 'C: ' + corr;
      $('todayDisc').textContent    = 'D: ' + e.disc;
    } else {
      $('todayPct').textContent = '—';
      $('todayFill').style.width = '0%';
    }

    const today = new Date();
    const currentMonth = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
    const monthEntries = entries.filter(e => e.date.startsWith(currentMonth));
    const mTotal = monthEntries.reduce((s,e) => s + e.total, 0);
    const mDisc  = monthEntries.reduce((s,e) => s + e.disc, 0);
    const mCorr  = mTotal - mDisc;
    const mAcc   = mTotal === 0 ? 0 : (mCorr / mTotal) * 100;
    
    if(mTotal > 0){
      $('monthPct').textContent = mAcc.toFixed(1) + '%';
      $('monthPct').style.color = colorFor(mAcc);
      $('monthFill').style.width = mAcc + '%';
      $('monthFill').style.background = colorFor(mAcc);
      $('monthCorrect').textContent = 'C: ' + mCorr;
      $('monthDisc').textContent    = 'D: ' + mDisc;
    }

    const oTotal = entries.reduce((s,e) => s + e.total, 0);
    const oDisc  = entries.reduce((s,e) => s + e.disc, 0);
    $('oTotal').textContent   = oTotal;
    $('oCorrect').textContent = oTotal - oDisc;
    $('oDisc').textContent    = oDisc;

    const chart = $('chart');
    const last7 = entries.slice(0, 7).reverse();
    if(last7.length){
      chart.innerHTML = last7.map(e => {
        const acc  = ((e.total - e.disc) / e.total) * 100;
        return `<div class="bar-w" style="height:100%">
          <div class="fill" style="height:${acc}%;background:${colorFor(acc)}"></div>
          <div class="d">${e.date.slice(5)}</div>
        </div>`;
      }).join('');
    }
  }

  // ==================== STAFF CRM LOGIC ====================
  // { id: { name, phone, pending, totalOpened, lastRemark } }
  let staffData = JSON.parse(localStorage.getItem('bankStaffData') || '{}');
  $('logDate').valueAsDate = new Date();
  if(localStorage.getItem('dailyTarget')) { $('dailyTarget').value = localStorage.getItem('dailyTarget'); }

  function saveTarget() {
    localStorage.setItem('dailyTarget', $('dailyTarget').value);
  }

  function addStaffMaster() {
    const name = $('newStaffName').value.trim();
    const phone = $('newStaffPhone').value.trim();
    if(!name) { alert('Enter Staff Name'); return; }

    const id = Date.now().toString();
    staffData[id] = { name: name, phone: phone, pending: 0, totalOpened: 0, lastRemark: '' };
    
    localStorage.setItem('bankStaffData', JSON.stringify(staffData));
    $('newStaffName').value = '';
    $('newStaffPhone').value = '';
    renderStaffUI();
  }

  function deleteStaffMaster(id) {
    if(!confirm('Delete staff and their data?')) return;
    delete staffData[id];
    localStorage.setItem('bankStaffData', JSON.stringify(staffData));
    renderStaffUI();
  }

  function saveStaffLog() {
    const date = $('logDate').value;
    const staffId = $('logStaffSelect').value;
    const opened = parseInt($('logOpened').value) || 0;
    const remark = $('logRemark').value.trim();
    const target = parseInt($('dailyTarget').value) || 1;

    if(!date) { alert('Select Date'); return; }
    if(!staffId) { alert('Select Staff'); return; }

    let staff = staffData[staffId];
    
    // Auto-Pending Logic: 
    // Purana Pending + (Aaj ka Target) - (Aaj khole gaye account)
    let newPending = staff.pending + target - opened;
    if(newPending < 0) newPending = 0; // Pending negative nahi ho sakta

    staff.pending = newPending;
    staff.totalOpened += opened;
    
    // Agar aaj 0 account khula hai, toh remark save karo, warna purana remark clear kardo
    if(opened < target && remark !== '') {
      staff.lastRemark = remark;
    } else if (opened >= target) {
      staff.lastRemark = '';
    }

    localStorage.setItem('bankStaffData', JSON.stringify(staffData));
    
    $('logOpened').value = '';
    $('logRemark').value = '';
    renderStaffUI();
    
    if(opened >= target) {
      alert(`✅ Target Achieved!\n\nStaff: ${staff.name}\nOpened: ${opened}\nPending Remaining: ${staff.pending}`);
    } else {
      alert(`⚠️ Shortfall Saved!\n\nStaff: ${staff.name}\nOpened: ${opened}\nPending Increased to: ${staff.pending}`);
    }
  }

  function renderStaffUI() {
    const dashboard = $('staffDashboard');
    const select = $('logStaffSelect');
    
    let selectHtml = '<option value="">-- Select Staff --</option>';
    const staffIds = Object.keys(staffData);
    
    // Find Top Performer
    let topId = null;
    let maxOpened = -1;
    staffIds.forEach(id => {
      if(staffData[id].totalOpened > maxOpened && staffData[id].totalOpened > 0) {
        maxOpened = staffData[id].totalOpened;
        topId = id;
      }
    });

    if(staffIds.length === 0) {
      dashboard.innerHTML = '<div class="empty">No staff added.</div>';
      select.innerHTML = selectHtml;
      return;
    }

    dashboard.innerHTML = staffIds.map(id => {
      const s = staffData[id];
      selectHtml += `<option value="${id}">${s.name}</option>`;
      
      const pendingBadge = s.pending > 0 
        ? `<span class="stat-badge bg-red">Pending: ${s.pending}</span>` 
        : `<span class="stat-badge bg-green">Clear (0)</span>`;
        
      const trophy = (id === topId) ? '🏆' : '';
      const remarkHtml = s.lastRemark ? `<p>📝 ${s.lastRemark}</p>` : '';
      
      // WhatsApp Message Logic
      const waMsg = encodeURIComponent(`Hello ${s.name}, your pending accounts are ${s.pending}. Please clear them today.`);
      const waLink = s.phone ? `https://wa.me/${s.phone}?text=${waMsg}` : `https://wa.me/?text=${waMsg}`;
      
      return `
        <div class="staff-card">
          <div class="staff-info">
            <h4>${s.name} ${trophy}</h4>
            ${remarkHtml}
            <div class="staff-stats">
              <span class="stat-badge bg-blue">Opens: ${s.totalOpened}</span>
              ${pendingBadge}
            </div>
          </div>
          <div>
            <button class="action-icon" onclick="window.open('${waLink}', '_blank')" title="WhatsApp">💬</button>
            <button class="action-icon" onclick="deleteStaffMaster('${id}')" title="Delete">❌</button>
          </div>
        </div>
      `;
    }).join('');
    
    select.innerHTML = selectHtml;
  }

  function exportCSV() {
    const staffIds = Object.keys(staffData);
    if(staffIds.length === 0) { alert('No data to export!'); return; }

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Staff Name,Phone,Total Opened,Pending,Last Remark\n";

    staffIds.forEach(id => {
      const s = staffData[id];
      const remark = s.lastRemark ? `"${s.lastRemark}"` : "";
      csvContent += `${s.name},${s.phone},${s.totalOpened},${s.pending},${remark}\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "staff_report.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function shareList() {
    const staffIds = Object.keys(staffData);
    if(staffIds.length === 0) { alert('List khaali hai!'); return; }
    
    let text = "*🏦 Staff Productivity & Pending Report*\n\n";
    let pendingStaff = [];
    let clearStaff = [];

    staffIds.forEach(id => {
      const s = staffData[id];
      if(s.pending > 0) {
        let r = s.lastRemark ? ` (${s.lastRemark})` : '';
        pendingStaff.push(`- ${s.name}: ${s.pending} pending${r}`);
      } else {
        clearStaff.push(`- ${s.name}: All clear!`);
      }
    });

    text += `⚠️ *PENDING STAFF (${pendingStaff.length})*\n`;
    text += pendingStaff.length ? pendingStaff.join('\n') + '\n\n' : "No pending staff.\n\n";

    text += `✅ *CLEAR STAFF (${clearStaff.length})*\n`;
    text += clearStaff.length ? clearStaff.join('\n') : "No clear staff.";

    if (navigator.share) {
      navigator.share({ title: 'Staff Report', text: text }).catch(() => {});
    } else {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert('Report copy ho gayi! WhatsApp par paste karein.');
    }
  }

  renderSummary();
  renderStaffUI();
</script>
</body>
</html>
