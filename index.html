<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTB Daily Productivity</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f6f9; color: #1f2937; padding: 16px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px; margin-bottom: 12px;
    background: #fff;
  }
  button {
    padding: 10px 16px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: #e5e7eb; color: #111; }
  .btn-wa { background: #25D366; color: #fff; }
  .btn-wa:hover { background: #1da851; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  .hidden { display: none !important; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; }
  .badge { padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; }
  .ok { background: #dcfce7; color: #166534; }
  .star { background: #fef3c7; color: #92400e; }
  .no { background: #fee2e2; color: #991b1b; }
  .absent { background: #e5e7eb; color: #4b5563; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 110px; background: #f9fafb;
    padding: 12px; border-radius: 10px; text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: #2563eb; }
  .stat .lbl { font-size: 12px; color: #6b7280; }
  .top { background: #fffbeb; border: 1px solid #fde68a; }
  .empty { text-align: center; color: #9ca3af; padding: 24px; }
</style>
</head>
<body>
<div class="container">
  <h1>NTB Daily Productivity</h1>
  <p class="sub">Minimum 1 NTB per day • 10 staff</p>

  <!-- ENTRY FORM -->
  <div class="card">
    <div class="row">
      <div>
        <label>Staff</label>
        <select id="staff"></select>
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div>
        <label>Status</label>
        <select id="status" onchange="toggleCount()">
          <option value="present">Present</option>
          <option value="absent">Absent</option>
        </select>
      </div>
      <div id="countWrap">
        <label>NTB Count</label>
        <input type="number" id="count" min="0" value="1">
      </div>
    </div>
    <label>Remarks (optional)</label>
    <input type="text" id="remarks" placeholder="e.g. 2 accounts from walk-in / sick leave">
    <button class="btn-primary" onclick="addEntry()">Save Entry</button>
  </div>

  <!-- SUMMARY -->
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:12px;">Daily Summary</h3>
    <div class="stats" id="stats"></div>
  </div>

  <!-- REPORT -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <h3 style="font-size:15px;">Report</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-wa" onclick="shareWhatsApp()">📲 WhatsApp</button>
        <button class="btn-ghost" onclick="exportCSV()">Export CSV</button>
        <button class="btn-ghost" onclick="clearAll()">Clear All</button>
      </div>
    </div>
    <div style="margin-bottom:12px;">
      <input type="date" id="filterDate" onchange="render()">
    </div>
    <div id="report"></div>
    <div id="absentBox" style="margin-top:16px;"></div>
  </div>
</div>

<script>
const STAFF = ["Ali","Ahmed","Sara","Bilal","Hina","Usman","Ayesha","Fahad","Zara","Kamran"];
const KEY = "ntb_entries";

document.getElementById("staff").innerHTML =
  STAFF.map(s => `<option>${s}</option>`).join("");

const today = new Date().toISOString().slice(0,10);
document.getElementById("date").value = today;
document.getElementById("filterDate").value = today;

function toggleCount() {
  const s = document.getElementById("status").value;
  document.getElementById("countWrap").classList.toggle("hidden", s === "absent");
}

function getEntries() {
  return JSON.parse(localStorage.getItem(KEY) || "[]");
}
function saveEntries(list) {
  localStorage.setItem(KEY, JSON.stringify(list));
}

function addEntry() {
  const staff = document.getElementById("staff").value;
  const date = document.getElementById("date").value;
  const status = document.getElementById("status").value;
  const count = status === "absent" ? 0 : parseInt(document.getElementById("count").value || "0");
  const remarks = document.getElementById("remarks").value.trim();

  if (!date) return alert("Date select karein");
  if (status === "present" && count < 0) return alert("Count 0 ya zyada ho");

  const list = getEntries();
  const existing = list.find(e => e.staff === staff && e.date === date);
  if (existing) {
    existing.status = status;
    existing.count = count;
    existing.remarks = remarks;
  } else {
    list.push({ id: Date.now() + Math.random(), staff, date, status, count, remarks });
  }
  saveEntries(list);
  document.getElementById("remarks").value = "";
  document.getElementById("count").value = 1;
  render();
}

function statusBadge(e) {
  if (e.status === "absent") return `<span class="badge absent">Absent</span>`;
  if (e.count >= 2) return `<span class="badge star">⭐ ${e.count} — Top</span>`;
  if (e.count === 1) return `<span class="badge ok">✅ 1 — Achieved</span>`;
  return `<span class="badge no">❌ 0 — Missed</span>`;
}

function render() {
  const filterDate = document.getElementById("filterDate").value;
  const list = getEntries().filter(e => e.date === filterDate);

  const present = list.filter(e => e.status === "present");
  const absent  = list.filter(e => e.status === "absent");
  const totalNTB = present.reduce((s,e)=> s + e.count, 0);
  const achieved = present.filter(e => e.count >= 1).length;
  const missed   = present.filter(e => e.count === 0).length;
  const topStaff = present.length
    ? present.reduce((a,b)=> b.count > a.count ? b : a)
    : null;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${totalNTB}</div><div class="lbl">Total NTB</div></div>
    <div class="stat"><div class="num">${achieved}</div><div class="lbl">Achieved</div></div>
    <div class="stat"><div class="num">${missed}</div><div class="lbl">Missed (0)</div></div>
    <div class="stat"><div class="num">${absent.length}</div><div class="lbl">Absent</div></div>
    <div class="stat top"><div class="num">${topStaff ? topStaff.staff : "—"}</div><div class="lbl">Top Performer</div></div>
  `;

  if (present.length === 0) {
    document.getElementById("report").innerHTML =
      `<div class="empty">Is date ke liye koi present staff entry nahi hai.</div>`;
  } else {
    const sorted = [...present].sort((a,b)=> b.count - a.count);
    let html = `<table><thead><tr>
      <th>Staff</th><th>NTB</th><th>Status</th><th>Remarks</th><th></th>
    </tr></thead><tbody>`;
    sorted.forEach(e => {
      html += `<tr>
        <td><strong>${e.staff}</strong></td>
        <td>${e.count}</td>
        <td>${statusBadge(e)}</td>
        <td style="color:#6b7280;font-size:13px;">${e.remarks || "—"}</td>
        <td><button class="btn-ghost" style="padding:4px 8px;font-size:12px;" onclick="delEntry('${e.id}')">Delete</button></td>
      </tr>`;
    });
    html += "</tbody></table>";
    document.getElementById("report").innerHTML = html;
  }

  if (absent.length === 0) {
    document.getElementById("absentBox").innerHTML = "";
  } else {
    let html = `<h4 style="font-size:13px;color:#6b7280;margin-bottom:8px;text-transform:uppercase;">
      Absent Today (${absent.length})</h4>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    absent.forEach(e => {
      html += `<span class="badge absent" style="padding:6px 12px;">
        ${e.staff}${e.remarks ? " — " + e.remarks : ""}
        <span onclick="delEntry('${e.id}')" style="cursor:pointer;margin-left:6px;color:#991b1b;">✕</span>
      </span>`;
    });
    html += `</div>`;
    document.getElementById("absentBox").innerHTML = html;
  }
}

function delEntry(id) {
  if (!confirm("Delete this entry?")) return;
  const list = getEntries().filter(e => String(e.id) !== String(id));
  saveEntries(list);
  render();
}

// ============ WHATSAPP SHARE ============
function shareWhatsApp() {
  const filterDate = document.getElementById("filterDate").value;
  const list = getEntries().filter(e => e.date === filterDate);

  if (list.length === 0) {
    alert("Pehle is date ke liye entries karein.");
    return;
  }

  const present = list.filter(e => e.status === "present").sort((a,b)=> b.count - a.count);
  const absent  = list.filter(e => e.status === "absent");
  const totalNTB = present.reduce((s,e)=> s + e.count, 0);
  const achieved = present.filter(e => e.count >= 1).length;
  const missed   = present.filter(e => e.count === 0).length;

  // date format: 25-Oct-2026
  const d = new Date(filterDate);
  const dayStr = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });

  let msg = `*NTB Daily Report*\n📅 ${dayStr}\n\n`;
  msg += `📊 *Summary*\n`;
  msg += `• Total NTB: *${totalNTB}*\n`;
  msg += `• Achieved (1+): ${achieved}\n`;
  msg += `• Missed (0): ${missed}\n`;
  msg += `• Absent: ${absent.length}\n\n`;

  if (present.length > 0) {
    msg += `✅ *Present Staff*\n`;
    present.forEach(e => {
      const mark = e.count >= 2 ? "⭐" : e.count === 1 ? "✅" : "❌";
      msg += `${mark} ${e.staff}: ${e.count}${e.remarks ? ` (${e.remarks})` : ""}\n`;
    });
    msg += `\n`;
  }

  if (absent.length > 0) {
    msg += `🚫 *Absent*\n`;
    absent.forEach(e => {
      msg += `• ${e.staff}${e.remarks ? ` (${e.remarks})` : ""}\n`;
    });
  }

  const url = "https://wa.me/?text=" + encodeURIComponent(msg);
  window.open(url, "_blank");
}

function exportCSV() {
  const list = getEntries();
  if (list.length === 0) return alert("Koi data nahi hai");
  let csv = "Staff,Date,Status,NTB Count,Result,Remarks\n";
  list.forEach(e => {
    const result = e.status === "absent" ? "Absent"
      : e.count >= 2 ? "Top" : e.count === 1 ? "Achieved" : "Missed";
    csv += `"${e.staff}","${e.date}","${e.status}",${e.count},"${result}","${e.remarks || ""}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ntb_report_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function clearAll() {
  if (!confirm("Saara data delete ho jayega. Sure?")) return;
  localStorage.removeItem(KEY);
  render();
}

render();
</script>
</body>
</html>
